*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#06253d,#08758c);min-height:100vh;color:#102335}
.wrap{max-width:1050px;margin:auto;padding:24px}

.feedback.show{display:block}
.btn{border:0;border-radius:999px;padding:14px 28px;font-size:18px;font-weight:900;cursor:pointer}

.next.show{display:block}
.start{background:#ffb400;color:#172330;width:100%;margin-top:20px}
.input{width:100%;padding:15px;border:3px solid #cbdbe5;border-radius:14px;font-size:17px;margin:7px 0 16px}
.label{display:block;font-weight:900;margin-top:5px}

.center{text-align:center}

let auth = null;

window.saveResultToFirestore = async function(data) {
  if (!db || !auth) throw new Error("Firebase belum terhubung. Periksa firebase-config.js.");

  const user = auth.currentUser;

    nama: data.nama,
    absen: String(data.absen),

    alasanSelesai: String(data.alasanSelesai || ""),
    uid: user.uid,
    createdAt: serverTimestamp()
  });
};

let timeLeft=120;
let timerInterval=null;
let gameStarted=false;
function startTimer(){
  clearInterval(timerInterval);
  timeLeft=120;
  updateTimer();
  timerInterval=setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      timerInterval=null;
      if(gameStarted) timeUp();
    }
  },1000);
}
function updateTimer(){
  const el=document.getElementById("timer");
  if(!el)return;
  const min=Math.floor(timeLeft/60);
  const sec=timeLeft%60;
  el.textContent=`⏱️ ${min}:${String(sec).padStart(2,"0")}`;
  el.className="timer"+(timeLeft<=20?" warning":timeLeft<=60?" safe":"");
}
function stopTimer(){clearInterval(timerInterval);timerInterval=null;}
function timeUp(){
  gameStarted=false;
  result(true);
}
let i=0, correctCount=0, answered=false, studentName="", studentAbsen="", sessionCode="";
let resultSaved=false;
let savePromise=null;
const game=document.getElementById("game");

function identity(){
 game.innerHTML=`
 <div class="center">
   <div style="font-size:70px">🎓</div>
   <h2>DATA PESERTA</h2>
   <p>Masukkan kode sesi, nama, dan nomor absen sebelum bermain.</p>
 </div>
 <div class="session-box">
   <div class="session-title">🔑 KODE SESI</div>
   <input id="session" class="input" style="margin-bottom:0" type="text" autocomplete="off" autocapitalize="characters" placeholder="Contoh: TATA-SUARA-001">
 </div>
 <label class="label">Nama Siswa</label>
 <input id="name" class="input" type="text" autocomplete="name" placeholder="Nama lengkap">
 <label class="label">Nomor Absen</label>
 <input id="absen" class="input" type="number" min="1" step="1" placeholder="Nomor absen">
 <button class="btn start" onclick="start()">🚀 MULAI GAME</button>`;
 const sessionInput=document.getElementById("session");
 sessionInput.value=sessionCode || localStorage.getItem("tataSuaraSession") || "";
 sessionInput.addEventListener("input",()=>{sessionInput.value=sessionInput.value.toUpperCase().replace(/\s+/g,"-");});
}
function start(){
 const n=document.getElementById("name").value.trim();
 const a=document.getElementById("absen").value.trim();
 const s=(document.getElementById("session").value||"").trim().toUpperCase();
 if(!s){alert("Silakan masukkan kode sesi.");document.getElementById("session").focus();return}
 if(!n||!a){alert("Silakan isi nama dan nomor absen.");return}
 if(!/^.{3,50}$/.test(s)){alert("Kode sesi tidak valid.");return}
 studentName=n;studentAbsen=a;sessionCode=s;
 localStorage.setItem("tataSuaraSession",sessionCode);
 i=0;correctCount=0;answered=false;examEnded=false;resultSaved=false;savePromise=null;gameStarted=true;startTimer();
 QUESTIONS.sort(()=>Math.random()-0.5);
 render();
}
function render(){
 answered=false;
 const q=QUESTIONS[i];
 game.innerHTML=`
 <div class="pills">
   <div class="pill">👤 ${studentName} • Absen ${studentAbsen}</div>
   <div class="pill">Soal ${i+1} / ${QUESTIONS.length}</div>
   <div class="pill">⭐ Benar: <span id="count">${correctCount}</span></div>
   <div id="timer" class="timer">⏱️ 2:00</div>
 </div>
 <div class="progress"><div class="fill" style="width:${(i/QUESTIONS.length)*100}%"></div></div>
 <div class="photo"><img src="${q.image}" alt="Foto jack audio"></div>
 <div class="question">${q.question}</div>
 <div class="options">${q.options.map((o,k)=>`<button class="option" onclick="answer(${k})">${String.fromCharCode(65+k)}. ${o}</button>`).join("")}</div>
 <div id="feedback" class="feedback"></div>
 <button id="next" class="btn next" onclick="nextQuestion()">LANJUT SOAL ➜</button>
 <div class="note">💡 Perhatikan bentuk jack, tentukan nama jenisnya atau pasangan jack yang tepat.</div>`;
}
function answer(k){
 if(answered)return;
 answered=true;
 const q=QUESTIONS[i];
 const buttons=[...document.querySelectorAll(".option")];
 buttons.forEach((b,idx)=>{if(q.options[idx]===q.correct)b.classList.add("correct")});
 const fb=document.getElementById("feedback");
 if(q.options[k]===q.correct){
   correctCount++;
   fb.style.background="#dff8e9";fb.style.color="#11613b";
   fb.innerHTML="🎊 BENAR! +1 jawaban benar";
   confetti(32);
 }else{
   buttons[k].classList.add("wrong");
   fb.style.background="#ffe4e8";fb.style.color="#9b2637";
   fb.innerHTML="😄 BELUM TEPAT! Jawaban benar: <b>"+q.correct+"</b>";
 }
 fb.classList.add("show");
 document.getElementById("count").textContent=correctCount;
 document.getElementById("next").classList.add("show");
}
function nextQuestion(){if(!gameStarted)return;i++;if(i<QUESTIONS.length)render();else{gameStarted=false;stopTimer();result(false)}}
async function result(timedOut=false, tabSwitch=false){
 if(resultSaved) return;
 examEnded=true;
 gameStarted=false;
 stopTimer();

 const nilai=Math.round(correctCount/QUESTIONS.length*100);
 let pred=nilai>=90?"🏆 MASTER JACK AUDIO!":nilai>=75?"🥳 JAGO TATA SUARA!":nilai>=60?"😎 LUMAYAN!":"💪 TERUS BERLATIH!";

 const tabSwitchMessage = `
   <div class="center">
     <div style="font-size:92px;line-height:1;margin:8px 0 28px">🚫</div>
     <h2 style="font-size:clamp(30px,6vw,48px);margin:0 0 34px">⚠️ UJIAN DIHENTIKAN!</h2>
     <p style="font-size:22px;margin:0 0 34px"><b>${studentName}</b> • Absen <b>${studentAbsen}</b></p>
     <p style="font-size:20px;margin:0 0 34px">Sesi: <b>${sessionCode}</b></p>
     <div id="saveStatus" class="save-status wait" style="font-size:20px;margin:0 0 34px">⏳ Menyimpan nilai ke rekap guru...</div>
     <p style="font-size:22px;line-height:1.45;margin:0 auto 34px;max-width:760px">
       Anda berpindah tab/aplikasi. Ujian otomatis diakhiri dan jawaban yang sudah dikerjakan tetap dihitung.
     </p>
     <div class="score">${nilai}</div>
     <div style="font-size:23px;font-weight:900">NILAI / 100</div>
     <p style="font-size:20px">Jawaban benar: <b>${correctCount}</b> dari <b>${QUESTIONS.length}</b> soal</p>
     <button class="btn restart" onclick="randomizeAndPlayAgain()">🔀 ACAK SOAL & MAIN LAGI</button>
   </div>`;

 const normalMessage = `
   <div class="center">
     <div style="font-size:78px">${timedOut?"⏰":"🎉"}</div>
     <h2>${timedOut?"WAKTU HABIS!":pred}</h2>
     <p style="font-size:20px"><b>${studentName}</b> • Absen <b>${studentAbsen}</b></p>
     <p style="font-size:16px">🔑 Sesi: <b>${sessionCode}</b></p>
     <p style="font-size:18px">${timedOut?"Waktu 2 menit telah habis. Jawaban yang sudah dikerjakan tetap dihitung.":"Waktu selesai."}</p>
     <div class="score">${nilai}</div>
     <div style="font-size:23px;font-weight:900">NILAI / 100</div>
     <p style="font-size:18px">Jawaban benar: <b>${correctCount}</b> dari <b>${QUESTIONS.length}</b> soal</p>
     <div id="saveStatus" class="save-status wait">⏳ Menyimpan nilai ke rekap guru...</div>
     <button class="btn restart" onclick="randomizeAndPlayAgain()">🔀 ACAK SOAL & MAIN LAGI</button>
   </div>`;

 game.innerHTML = tabSwitch ? tabSwitchMessage : normalMessage;
 if(!tabSwitch) confetti(90);

 const data={
   nama:studentName,
   absen:studentAbsen,
   sesi:sessionCode,
   benar:correctCount,
   total:QUESTIONS.length,
   nilai,
   waktuSelesai:new Date().toLocaleString("id-ID",{dateStyle:"short",timeStyle:"medium"}),
   tabSwitch:Boolean(tabSwitch),
   pindahTab:Boolean(tabSwitch),
   statusUjian:tabSwitch ? "dihentikan_pindah_tab" : (timedOut ? "waktu_habis" : "selesai"),
   alasanSelesai:tabSwitch
     ? "Anda berpindah tab/aplikasi. Ujian otomatis diakhiri."
     : (timedOut ? "Waktu habis." : "Ujian selesai.")
 };
 savePromise=window.saveResultToFirestore(data).then(()=>{
   resultSaved=true;
   const el=document.getElementById("saveStatus");
   if(el){el.className="save-status ok";el.textContent="✅ Nilai berhasil masuk ke rekap guru.";}
 }).catch(err=>{
   console.error("Gagal menyimpan hasil:",err);
   const el=document.getElementById("saveStatus");
   if(el){el.className="save-status err";el.textContent="❌ Nilai belum tersimpan. Periksa koneksi internet dan Firestore Rules.";}
 });
 return savePromise;
}
function randomizeAndPlayAgain(){
  // Ronde baru menggunakan kode sesi dan identitas peserta yang sama.
  resultSaved=false;
  savePromise=null;
  QUESTIONS.sort(()=>Math.random()-0.5);
  i=0;
  correctCount=0;
  answered=false;
  examEnded=false;
  gameStarted=true;
  startTimer();
  render();
}


let examEnded=false;
function forceFinish(){
 if(examEnded||!gameStarted) return;
 result(false,true);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden) forceFinish();});
window.addEventListener("pagehide",forceFinish);
window.addEventListener("blur",()=>{setTimeout(()=>{if(document.hidden) forceFinish();},100);});
const cvs=document.getElementById("confetti"),ctx=cvs.getContext("2d");let pieces=[];
function size(){cvs.width=innerWidth;cvs.height=innerHeight}addEventListener("resize",size);size();
function confetti(n){
 for(let j=0;j<n;j++)pieces.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*10-3,s:Math.random()*7+3,a:1,r:Math.random()*6.28});
}
function loop(){
 ctx.clearRect(0,0,cvs.width,cvs.height);
 pieces=pieces.filter(p=>p.a>0);
 pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.a-=.012;ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=["#ffb400","#159bd7","#ef4f72","#29b36b","#8c5de8"][Math.floor(Math.random()*5)];ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);ctx.restore()});
 requestAnimationFrame(loop)
}
window.start=start;
window.answer=answer;
window.nextQuestion=nextQuestion;
window.randomizeAndPlayAgain=randomizeAndPlayAgain;
window.forceFinish=forceFinish;
loop();identity();
document.addEventListener("keydown",e=>{
 if(e.key==="Enter" && document.getElementById("name") && !gameStarted){start();}
});


</script>
</body>
</html>
